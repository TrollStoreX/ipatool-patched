name: Build ipatool (patched)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: Fetch source
        run: |
          curl -sL https://github.com/majd/ipatool/archive/refs/tags/v2.8.0.tar.gz -o src.tgz
          tar xzf src.tgz

      - name: Patch MAC check
        run: |
          python3 - <<'PYEOF2'
          import re, pathlib
          p = pathlib.Path('ipatool-2.8.0/pkg/util/machine/mac_address.go')
          s = p.read_text()
          print('--- BEFORE ---'); print(s[s.find('func usableMacAddress'):s.find('func usableMacAddress')+400])
          new_body = """func usableMacAddress(address net.HardwareAddr) bool {
          	return len(address) == 6 && address[0]&1 == 0
          }"""
          s2, n = re.subn(r'func usableMacAddress\(address net\.HardwareAddr\) bool \{[^}]*\}', new_body, s, flags=re.S)
          print('replaced', n)
          assert n == 1, 'pattern not matched'
          p.write_text(s2)
          print('--- AFTER ---'); print(s2[s2.find('func usableMacAddress'):s2.find('func usableMacAddress')+200])
          PYEOF2

      - name: Build static
        run: |
          cd ipatool-2.8.0
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o /tmp/ipatool-static ./
          ls -la /tmp/ipatool-static
          file /tmp/ipatool-static

      - uses: actions/upload-artifact@v4
        with:
          name: ipatool-linux-arm64-patched
          path: /tmp/ipatool-static
