name: Build ipatool musl v5

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-musl5.yml'

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build in Alpine
        uses: addnab/docker-run-action@v3
        with:
          image: golang:1.26-alpine
          options: -v ${{ github.workspace }}:/work -w /work
          run: |
            set -e
            apk add --no-cache curl tar gcc musl-dev
            curl -sL https://github.com/majd/ipatool/archive/refs/tags/v2.8.0.tar.gz -o s.tgz
            tar xzf s.tgz
            echo "" | base64 -d > ipatool-2.8.0/pkg/util/machine/mac_address.go
            cd ipatool-2.8.0
            CGO_ENABLED=1 go build -trimpath -ldflags "-s -w" -o /work/ipatool-musl5 ./
            ls -la /work/ipatool-musl5
      - uses: actions/upload-artifact@v4
        with:
          name: ipatool-musl5
          path: ipatool-musl5
